# Represents a Pokémon's attack types
type Attack {
  # The name of this Pokémon attack
  name: String

  # The type of this Pokémon attack
  type: String

  # The damage of this Pokémon attack
  damage: Int
}

# Represents a Pokémon
type Pokemon {
  # The ID of an object
  id: ID!

  # The identifier of this Pokémon
  number: String

  # The name of this Pokémon
  name: String

  # The minimum and maximum weight of this Pokémon
  weight: PokemonDimension

  # The minimum and maximum weight of this Pokémon
  height: PokemonDimension

  # The classification of this Pokémon
  classification: String

  # The type(s) of this Pokémon
  types: [String]

  # The type(s) of Pokémons that this Pokémon is resistant to
  resistant: [String]

  # The attacks of this Pokémon
  attacks: PokemonAttack

  # The type(s) of Pokémons that this Pokémon weak to
  weaknesses: [String]
  fleeRate: Float

  # The maximum CP of this Pokémon
  maxCP: Int

  # The evolutions of this Pokémon
  evolutions: [Pokemon]

  # The evolution requirements of this Pokémon
  evolutionRequirements: PokemonEvolutionRequirement

  # The maximum HP of this Pokémon
  maxHP: Int
  image: String
}

# Represents a Pokémon's attack types
type PokemonAttack {
  # The fast attacks of this Pokémon
  fast: [Attack]

  # The special attacks of this Pokémon
  special: [Attack]
}

# Represents a Pokémon's dimensions
type PokemonDimension {
  # The minimum value of this dimension
  minimum: String

  # The maximum value of this dimension
  maximum: String
}

# Represents a Pokémon's requirement to evolve
type PokemonEvolutionRequirement {
  # The amount of candy to evolve
  amount: Int

  # The name of the candy to evolve
  name: String
}

# A filtered, paginated page of Pokémon
type PokemonsPage {
  # Pokémon matching the filters for the current page, ordered by id ascending
  items: [Pokemon]!

  # Total number of Pokémon matching the filters (ignoring limit/offset)
  total: Int!

  # Whether another page of matching Pokémon exists after this one
  hasNextPage: Boolean!
}

# Query any Pokémon by number or name
type Query {
  query: Query
  pokemons(first: Int): [Pokemon]

  # Pokémon with filtering (name substring, type, evolution stage) and keyset-free offset pagination
  pokemonsPage(
    # Case-insensitive substring matched against the Pokémon name
    name: String

    # Type the Pokémon must have (case-insensitive), e.g. "Fire"
    type: String

    # Evolution stage: 1 = base form, 2 = first evolution, 3 = second evolution
    evolutionStage: Int

    # Page size, maximum 100 (defaults to 20)
    limit: Int

    # Zero-based number of matching Pokémon to skip (defaults to 0)
    offset: Int
  ): PokemonsPage!
  pokemon(id: String, name: String): Pokemon
}
